[package]
name = "tether"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
eventsource-stream = "0.2.3"
fastembed = "7.1.0"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlite-vec = "0.1.9"
sqlx = { version = "0.9.0", features = [
  "sqlite",
  "runtime-tokio",
  "tls-rustls",
] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
libsqlite3-sys = "0.31"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
